# Minimal stand-alone rippled configuration for local development/testing.
#
# This node never connects to any peer-to-peer network or performs consensus
# (it's started with --standalone --start). It exists purely so this
# project's scripts and integration tests have a free, disposable, fully
# local XRPL instance to run against. Do not use this configuration for
# anything connected to Mainnet, Testnet, or Devnet.
#
# Loosely based on the example stand-alone/CI configs published by
# XRPLF (rippled/xrpl.js), trimmed to what stand-alone mode actually needs.

[server]
port_rpc_admin_local
port_ws_admin_local
port_peer

# Bind to the wildcard address (not just localhost) so Docker's port mapping can reach
# these ports from the host.
[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws_admin_local]
port = 6006
ip = 0.0.0.0
admin = 0.0.0.0
protocol = ws

# Present but unused: rippled expects a peer port to be configured even
# though stand-alone mode never actually opens peer connections.
[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
tiny

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
advisory_delete=0

[ledger_history]
full

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.apple.com
time.nist.gov
pool.ntp.org

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

# Force-enable amendments whose default vote is "no" even though they are
# already fully enabled on Mainnet (many amendments keep a default:no vote
# indefinitely after activation -- this only affects what a *fresh* genesis
# ledger created via --start includes, not real network consensus).
[amendments]
950AE2EA4654E47F04AA8739C0B214E242097E802FD372D24047A89AB1F5EC38 MPTokensV1
56B241D7A43D40354D02A9DC4C8DF5C7A1F930D92A9035C4E12291B3CA3E1C2B Clawback
